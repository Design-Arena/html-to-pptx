<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; font-family: Arial, sans-serif; }
  .slide { width: 1920px; height: 1080px; display: none; position: relative; overflow: hidden; background: #0f172a; color: #f8fafc; }
  .slide.active { display: flex; }

  /* Grid slide root: forcing display:flex would make the columns inert. */
  .slide.layout-two-col.active { display: grid; grid-template-columns: 1fr 1fr; }
  .col { padding: 80px; font-size: 48px; }

  /* Reveal-triggered animation and transition start at opacity 0. */
  @keyframes rise { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
  .slide.active .rise { animation: rise 0.8s ease both; }
  .fade { opacity: 0; transition: opacity 0.6s; }
  .slide.active .fade { opacity: 1; }

  /* Paint with no OOXML equivalent: radial glow background + pseudo glow. */
  .slide.glow { background: radial-gradient(circle at 50% 50%, rgb(255, 0, 0) 0%, rgb(15, 23, 42) 40%); }
  .slide.glow::before { content: ""; position: absolute; right: 0; top: 0; width: 200px; height: 200px; background: rgb(0, 255, 0); }
  .glow-card { position: absolute; left: 1200px; top: 600px; width: 500px; height: 300px; padding: 40px;
               background: radial-gradient(circle, rgb(0, 0, 255), rgb(0, 0, 80)); font-size: 40px; }

  .shadow-card { position: absolute; left: 100px; top: 100px; width: 600px; height: 300px; background: #1e293b;
                 border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); }
  .badge { position: absolute; left: 100px; top: 500px; font-size: 24px; letter-spacing: 4px; text-transform: uppercase; }
  table { position: absolute; left: 100px; top: 650px; border-collapse: collapse; font-size: 28px; }
  tr.rule { border-bottom: 2px solid rgb(255, 0, 255); }
  td { padding: 12px 24px; }
  .quote { position: absolute; left: 900px; top: 100px; font-size: 40px; padding-left: 60px; }
  .quote::before { content: "\201C"; position: absolute; left: 0; top: -20px; font-size: 120px; color: rgb(250, 204, 21); }
  canvas { position: absolute; left: 900px; top: 300px; }
  .thin-rule { position: absolute; background: rgb(255, 0, 0); }
</style>
</head>
<body>
<section class="slide layout-two-col active">
  <div class="col">Left column</div>
  <div class="col">Right column</div>
</section>
<section class="slide">
  <h1 class="rise" style="position:absolute; left:100px; top:100px; font-size:80px;">Animated title</h1>
  <p class="fade" style="position:absolute; left:100px; top:300px; font-size:40px;">Faded paragraph</p>
  <aside class="notes">Say hello to the board.</aside>
</section>
<section class="slide glow">
  <div class="glow-card">Glow card text</div>
</section>
<section class="slide">
  <div class="shadow-card"></div>
  <div class="badge">New feature</div>
  <table><tr class="rule"><td>Revenue</td><td>$4.2M</td></tr></table>
  <div class="quote">Design is how it works.</div>
  <canvas id="chart" width="300" height="200"></canvas>
  <img id="webp" src="data:image/webp;base64,UklGRhwAAABXRUJQVlA4TA8AAAAvD8ADAAdQ5Ij+ByKi/wEA"
       style="position:absolute; left:1400px; top:300px; width:200px; height:200px;">
</section>
<section class="slide">
  <span style="position:absolute; left:100px; top:100px; font-size:40px; white-space:pre">  A  B  </span>
  <div style="position:absolute; left:100px; top:200px; font-size:40px; white-space:pre">  x <b>  bold  </b> y  </div>
  <span style="position:absolute; left:100px; top:300px; font-size:40px">   collapsed   text&nbsp;&nbsp;kept   </span>
  <pre style="position:absolute; left:100px; top:400px; font-size:30px">def f():
    return 1</pre>
  <div style="position:absolute; left:100px; top:600px; font-size:30px">Presented by <b>Dr. Amna</b><br>Resident</div>
  <span style="position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip:rect(0,0,0,0)">Skip to content</span>
  <span style="position:absolute; left:0; top:0; width:1px; height:1px; overflow:hidden">Hidden label</span>
  <div class="thin-rule" style="left:1000px; top:100px; width:200px; height:2px"></div>
  <div class="thin-rule" style="left:1000px; top:150px; width:200px; height:1px"></div>
  <div class="thin-rule" style="left:1000px; top:200px; width:200px; height:0.5px"></div>
  <div class="thin-rule" style="left:1300px; top:100px; width:1px; height:200px"></div>
  <div class="thin-rule" style="left:1350px; top:100px; width:0.5px; height:200px"></div>
  <div class="thin-rule" style="left:1400px; top:100px; width:0; height:200px"></div>
</section>
<script>
  const ctx = document.getElementById('chart').getContext('2d');
  ctx.fillStyle = 'rgb(255, 0, 0)';
  ctx.fillRect(0, 0, 300, 200);
</script>
</body>
</html>
